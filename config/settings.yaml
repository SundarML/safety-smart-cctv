cameras:
  - id: cam_01
    name: "Home Entrance"
    source: "rtsp://admin:${DVR_PASSWORD}@192.168.150.102:554/Streaming/Channels/102"
    # source: 0               # webcam index
    # source: "test_video.mp4"

  - id: cam_02
    name: "Main Street"
    source: "rtsp://admin:${DVR_PASSWORD}@192.168.150.102:554/Streaming/Channels/202"

  - id: cam_03
    name: "Inside House"
    source: "rtsp://admin:${DVR_PASSWORD}@192.168.150.102:554/Streaming/Channels/302"

  - id: cam_04
    name: "Backyard"
    source: "rtsp://admin:${DVR_PASSWORD}@192.168.150.102:554/Streaming/Channels/402"

model:
  enabled: true            # set false to disable PPE detection
  weights: "models/ppe.pt"
  confidence: 0.50
  iou: 0.45
  device: "cpu"            # use "cuda" if you have an NVIDIA GPU

fire_smoke:
  enabled: true            # set false to disable fire/smoke detection
  weights: "models/fire_smoke.pt"
  confidence: 0.40
  iou: 0.45
  device: "cpu"
  alert_classes:
    - "fire"
    - "smoke"

ppe:
  # Class names match the Construction Site Safety dataset from Roboflow Universe.
  # Full class list: Hardhat, Mask, NO-Hardhat, NO-Mask, NO-Safety Vest,
  #                  Person, Safety Cone, Safety Vest, machinery, vehicle
  violation_classes:
    - "NO-Hardhat"
    - "NO-Safety Vest"
    - "NO-Mask"

  safe_classes:
    - "Hardhat"
    - "Safety Vest"
    - "Mask"
    - "Person"
    - "Safety Cone"

display:
  show_window: true
  frame_width: 1280
  frame_height: 720

logging:
  save_violations: true
  log_dir: "logs"
  save_frames: true         # save a snapshot image on each new violation
